                if (data.adminName) setAdminName(data.adminName);
                if (data.requireConfirm !== undefined) setRequireConfirm(data.requireConfirm);
                if (data.requireMemberInfo !== undefined) setRequireMemberInfo(data.requireMemberInfo);
              }
            }
          } catch (err) {
            console.error("Failed to fetch cloud data:", err);
            const localBackup = JSON.parse(localStorage.getItem('poker_cloud_backup'));
            if (localBackup && localBackup.lastModified > localLastModified.current) {
                localLastModified.current = localBackup.lastModified;
                fullStateRef.current = { ...fullStateRef.current, ...localBackup };
                setQueues(localBackup.queues || []);
                setHistory(localBackup.history || []);
                setTables(localBackup.tables || []);
                setBlindVis(localBackup.blindVis || {});
                setPmlData(localBackup.pmlData || []);
                setPmlHistory(localBackup.pmlHistory || []);
                setPenalties(localBackup.penalties || []);
                if (localBackup.weeklyPresets) setWeeklyPresets(localBackup.weeklyPresets);
                if (localBackup.autoBlindEnabled !== undefined) setAutoBlindEnabled(localBackup.autoBlindEnabled);
            }
          }
        };

        fetchCloudData(); 
        const syncInterval = setInterval(fetchCloudData, 3000); 

        const checkNewDay = () => {
            const currentDate = new Date();
            const tradingDate = new Date(currentDate);
            if (tradingDate.getHours() < 4) {
                tradingDate.setDate(tradingDate.getDate() - 1);
            }
            const dateString = tradingDate.toISOString().split('T')[0];
            const savedDate = localStorage.getItem('poker_trading_date_cloud');

            if (savedDate !== dateString) {
                setShowNewDayReminder(true);
                localStorage.setItem('poker_trading_date_cloud', dateString);

                const dayOfWeek = tradingDate.getDay();
                if (fullStateRef.current.autoBlindEnabled) {
                    const todayPreset = fullStateRef.current.weeklyPresets[dayOfWeek];
                    let newVis = { ...fullStateRef.current.blindVis };
                    BLINDS.forEach(b => {
                        newVis[b.prefix] = todayPreset[b.prefix] !== false; 
                    });
                    updateCloudState({ blindVis: newVis });
                }
            }
        };

        checkNewDay();
        const timerNewDay = setInterval(checkNewDay, 60000);

        const timer = setInterval(() => {
          setQueues(currentQueues => {
            let modified = false;
            const currentTimeMs = Date.now();
            const updated = currentQueues.map(q => {
              if (q.status === 'Calling' && q.callingStartedAt) {
                const elapsed = currentTimeMs - q.callingStartedAt;
                if (elapsed >= CALLING_TIME_LIMIT_MS && !q.guestReply) {
                  modified = true;
                  return { ...q, status: "Time's Up" };
                }
              }
              return q;
            });
            if (modified) {
              updateCloudState({ queues: updated });
              return updated;
            }
            return currentQueues;
          });
        }, 1000);

        const handleBeforeUnload = (e) => {
          if (history.length > 0 || pmlHistory.length > 0) {
            triggerDownloads(true);
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);

        return () => {
          window.removeEventListener('beforeunload', handleBeforeUnload);
          clearInterval(timer);
          clearInterval(timerNow);
          clearInterval(timerNewDay);
          clearInterval(syncInterval);
        };
      }, []);

      const visibleBlindsList = BLINDS.filter(b => blindVis[b.prefix] !== false);

      const seatedPhones = new Set();
      tables.forEach(t => {
          t.seats.forEach(s => {
              if (s) seatedPhones.add(s.phone);
          });
      });

      const handlePmlPenalty = (pmlIndex, row, hours) => {
          const playerStr = row.player;
          if (!playerStr || playerStr.trim() === '') {
              setDialog({ type: 'alert', title: 'Action Denied', message: 'Please enter a Player Name / Queue ID in the row first before applying a penalty.', onConfirm: () => setDialog(null) });
              return;
          }
          
          let qId = '';
          let nickName = '';
          const match = playerStr.match(/^([A-Z0-9]+)(?:\s*\(([^)]+)\))?/i); 
          if (match) { qId = match[1].toUpperCase(); nickName = match[2] ? match[2].trim() : ''; } 
          else { nickName = playerStr.trim(); }

          const activeQueue = queues.find(q => (qId && q.id === qId) || (nickName && q.nickName.toUpperCase() === nickName.toUpperCase()));

          const applyPenaltyAndPml = (empid) => {
              const guest = activeQueue || history.find(q => q.id === qId);
              const phone = guest ? guest.phone : null;
              const finalNick = guest ? guest.nickName : nickName;
              const unbanTime = Date.now() + (hours * 60 * 60 * 1000);
              
              const newPenalty = { phone, qId, nickName: finalNick, unbanTime };
              const updatedPenalties = penalties.filter(p => p.qId !== qId && (phone ? p.phone !== phone : true));
              updatedPenalties.push(newPenalty);

              let updatedQueues = [...queues];
              let updatedHistory = [...history];

              if (activeQueue) {
                  const endedAt = Date.now();
                  const durationMins = ((endedAt - activeQueue.createdAt) / 60000).toFixed(2);
                  const historyRecord = { ...activeQueue, status: 'Canceled (Penalty)', endedAt, duration: `${durationMins} mins`, adminId: adminName };
                  updatedHistory.push(historyRecord);
                  updatedQueues = queues.filter(item => item.id !== activeQueue.id);
              }

              const currentTime = new Date();
              const unbanTimeObj = new Date(unbanTime);
              const currentTimeStr = currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
              const unbanTimeStr = unbanTimeObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
              
              let newRemark = `Cancel ${hours === 1 ? '1 hr' : '2 hrs'} cannot queue (Until ${unbanTimeStr}) - Auth: ${empid}`;
              
              const newPmlData = [...pmlData];
              newPmlData[pmlIndex] = { ...newPmlData[pmlIndex], remark: newRemark, status: 'Cancel', movedTime: currentTimeStr };

              updateCloudState({ penalties: updatedPenalties, queues: updatedQueues, history: updatedHistory, pmlData: newPmlData });
              setDialog(null);
          };

          const isWarning = !!activeQueue;
          setDialog({
              type: 'prompt',
              title: isWarning ? 'Active Queue Found & Penalty' : 'Apply Penalty',
              message: isWarning 
                  ? `Warning: ${activeQueue.id} (${activeQueue.nickName}) currently has an active queue!\n\nThis will apply a ${hours}-hour ban AND cancel their active queue.\n\nEnter Supervisor EMPID and Password to override:`
                  : `Apply a ${hours}-hour ban for ${playerStr}?\n\nEnter Supervisor EMPID and Password to verify:`,
              input: '',
              inputPlaceholder: 'Supervisor EMPID',
              inputType: 'text',
              input2: '',
              inputPlaceholder2: 'Admin Password',
              inputType2: 'password',
              confirmText: isWarning ? 'Override & Cancel' : 'Verify & Apply',
              confirmStyle: 'danger',
              onConfirm: () => {
                  const empid = document.getElementById('dialog-input').value.trim();
                  const pass = document.getElementById('dialog-input-2').value;
                  if (!empid) {
                      setDialog({ type: 'alert', title: 'Error', message: 'Supervisor EMPID is required.', onConfirm: () => setDialog(null) });
                      return;
                  }
                  if (pass === ADMIN_PASSWORD) {
                      applyPenaltyAndPml(empid);
                  } else {
                      setDialog({ type: 'alert', title: 'Error', message: 'Invalid Supervisor Password. Action aborted.', onConfirm: () => setDialog(null) });
                  }
              },
              onCancel: () => setDialog(null)
          });
      };

      const handleCheckPmlPenalty = (playerStr, onSuccess, onRevert) => {
        if (!playerStr) return;
        let qId = '';
        let nickName = '';
        const match = playerStr.match(/^([A-Z0-9]+)(?:\s*\(([^)]+)\))?/i); 
        if (match) { qId = match[1].toUpperCase(); nickName = match[2] ? match[2].trim().toUpperCase() : ''; } 
        else { nickName = playerStr.trim().toUpperCase(); }

        const activePenalty = penalties.find(p => {
            if (p.unbanTime <= Date.now()) return false;
            const matchQ = p.qId && qId && p.qId === qId;
            const matchN = p.nickName && nickName && p.nickName.toUpperCase().trim() === nickName;
            return matchQ || matchN;
        });

        if (activePenalty) {
            setDialog({
                type: 'prompt',
                inputType: 'password',
                title: 'Player Restricted',
                message: `Warning: '${activePenalty.nickName || activePenalty.qId}' was canceled previously and is banned from queuing/transferring until ${new Date(activePenalty.unbanTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })}.\n\nSupervisor Override Password to allow PML entry:`,
                input: '',
                confirmText: 'Override & Allow',
                confirmStyle: 'danger',
                onConfirm: () => {
                    const val = document.getElementById('dialog-input').value;
                    if (val === ADMIN_PASSWORD) {
                        const updated = penalties.filter(p => p !== activePenalty);
                        updateCloudState({ penalties: updated });
                        setDialog(null);
                        if (onSuccess) onSuccess();
                    } else {
                        setDialog({ type: 'alert', title: 'Error', message: 'Invalid Supervisor Password. Entry reverted.', onConfirm: () => { setDialog(null); if (onRevert) onRevert(); } });
                    }
                },
                onCancel: () => { setDialog(null); if (onRevert) onRevert(); }
            });
        } else {
            if (onSuccess) onSuccess();
        }
      };

      const triggerDownloads = (isSilent = false) => {
        let exported = false;
        const qData = [];
        const pmlDataExport = [];
        const tableDataExport = [];

        tableDataExport.push(['Table ID', 'Blind Prefix', 'Status', 'Seat 1', 'Seat 2', 'Seat 3', 'Seat 4', 'Seat 5', 'Seat 6', 'Seat 7', 'Seat 8', 'Seat 9', 'Spare']);
        tables.forEach(t => {
            const row = [t.id, t.blindPrefix || 'None', t.isOpen ? 'Open' : 'Closed'];
            t.seats.forEach(s => row.push(s ? `${s.id} (${s.nickName})` : 'Empty'));
            tableDataExport.push(row);
        });

        const qHeaders = ['Queue Number', 'Nick Name', 'Member Name', 'Member ID', 'Phone', 'Blind', 'Status', 'Register Time', 'Confirm Time', 'End/Seat Time', 'Duration', 'Guest Reply', 'Counter Reply', 'Admin ID'];
        qData.push(qHeaders);

        queues.forEach(q => {
            qData.push([ q.id, `"${q.nickName || ''}"`, `"${q.memberName || ''}"`, `"${q.memberId || ''}"`, q.phone, `"${q.blindObj?.blind || ''}"`, q.status, `"${new Date(q.createdAt).toLocaleString()}"`, q.confirmedAt ? `"${new Date(q.confirmedAt).toLocaleString()}"` : '"N/A"', '"Active"', '"Active"', `"${q.guestReply || 'N/A'}"`, `"${q.adminReply || 'N/A'}"`, `"${q.adminId || ''}"` ]);
        });

        tables.forEach(t => {
            t.seats.forEach((s, idx) => {
                if (s) {
                    qData.push([ s.id, `"${s.nickName || ''}"`, `"${s.memberName || ''}"`, `"${s.memberId || ''}"`, s.phone, `"${s.blindObj?.blind || ''}"`, `"Seated at ${t.id} (Seat ${idx < 9 ? idx + 1 : 'Spare'})"`, `"${new Date(s.createdAt).toLocaleString()}"`, s.confirmedAt ? `"${new Date(s.confirmedAt).toLocaleString()}"` : '"N/A"', s.seatedAt ? `"${new Date(s.seatedAt).toLocaleString()}"` : '"N/A"', '"Seated"', `"${s.guestReply || 'N/A'}"`, `"${s.adminReply || 'N/A'}"`, `"${s.adminId || ''}"` ]);
                }
            });
        });

        history.forEach(h => {
            qData.push([ h.id, `"${h.nickName || ''}"`, `"${h.memberName || ''}"`, `"${h.memberId || ''}"`, h.phone, `"${h.blindObj?.blind || ''}"`, h.status, `"${new Date(h.createdAt).toLocaleString()}"`, h.confirmedAt ? `"${new Date(h.confirmedAt).toLocaleString()}"` : '"N/A"', h.endedAt ? `"${new Date(h.endedAt).toLocaleString()}"` : '"N/A"', h.duration || '"N/A"', `"${h.guestReply || 'N/A'}"`, `"${h.adminReply || 'N/A'}"`, `"${h.adminId || ''}"` ]);
        });

        const pHeaders = ['Original Row #', 'Table', 'Seat', 'Blinds', 'Player Name / Queue', 'Request Time', 'Status', 'Moved Time', 'Remark', 'Cleared At', 'Admin ID'];
        pmlDataExport.push(pHeaders);

        pmlData.forEach((p, i) => {
            if (p.player || p.table || p.blind || p.status) {
                pmlDataExport.push([ i + 1, p.table, p.seat || '', p.blind, `"${p.player || ''}"`, p.reqTime, p.status, p.movedTime, `"${p.remark || ''}"`, '"Active"', `"${p.adminId || ''}"` ]);
            }
        });

        pmlHistory.forEach(p => {
            pmlDataExport.push([ p.originalIndex + 1, p.table, p.seat || '', p.blind, `"${p.player || ''}"`, p.reqTime, p.status, p.movedTime, `"${p.remark || ''}"`, p.deletedAt ? `"${new Date(p.deletedAt).toLocaleString()}"` : '"N/A"', `"${p.adminId || ''}"` ]);
        });

        const rawState = { queues, history, pmlData, pmlHistory, tables, blindVis, penalties, weeklyPresets, autoBlindEnabled };
        const rawDataExport = [
            ['WARNING', 'DO NOT EDIT THIS SHEET. IT IS USED FOR SYSTEM RECOVERY.'],
            ['DATA', JSON.stringify(rawState)]
        ];

        if (qData.length > 1 || pmlDataExport.length > 1 || tableDataExport.length > 1) {
            const wb = XLSX.utils.book_new();
            const wsTables = XLSX.utils.aoa_to_sheet(tableDataExport);
            XLSX.utils.book_append_sheet(wb, wsTables, "Tables & Seats");
            const wsQueues = XLSX.utils.aoa_to_sheet(qData);
            XLSX.utils.book_append_sheet(wb, wsQueues, "Queue History");
            const wsPml = XLSX.utils.aoa_to_sheet(pmlDataExport);
            XLSX.utils.book_append_sheet(wb, wsPml, "Movement History");
            const wsRaw = XLSX.utils.aoa_to_sheet(rawDataExport);
            XLSX.utils.book_append_sheet(wb, wsRaw, "RawData");

            XLSX.writeFile(wb, `RWS_Poker_Records_${new Date().toISOString().split('T')[0]}.xlsx`);
            exported = true;
        }

        if (!exported && isSilent !== true) setDialog({ type: 'alert', title: 'No Data', message: 'No records to export yet.', onConfirm: () => setDialog(null) });
        else if (exported && isSilent !== true) setDialog({ type: 'alert', title: 'Backup Successful', message: 'Data backup downloaded as an Excel file.', onConfirm: () => setDialog(null) });
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                if (!wb.Sheets['RawData']) throw new Error('No Recovery Data found! Make sure you are uploading a valid backup Excel file generated by this system.');
                
                const rawDataArray = XLSX.utils.sheet_to_json(wb.Sheets['RawData'], { header: 1 });
                const jsonRow = rawDataArray.find(row => row[0] === 'DATA');
                if (!jsonRow || !jsonRow[1]) throw new Error('Recovery data is corrupted or missing.');

                const restoredState = JSON.parse(jsonRow[1]);
                updateCloudState(restoredState);
                
                setDialog({ type: 'alert', title: 'Recovery Successful', message: 'All tables, queues, and PML data have been fully restored and synced to the cloud.', onConfirm: () => setDialog(null) });
            } catch (error) {
                setDialog({ type: 'alert', title: 'Recovery Failed', message: error.message, onConfirm: () => setDialog(null) });
            } finally {
                e.target.value = '';
            }
        };
        reader.readAsBinaryString(file);
      };

      const handleAdminExit = () => {
        if (history.length > 0 || pmlHistory.length > 0 || queues.length > 0) triggerDownloads(true); 
        setView('guest-setup');
      };

      const executeLogin = (queueEntries, phone) => {
        let hasError = false;
        let errorMsg = '';
        let newQueuesToAdd = [];
        let activeIds = new Set(); 

        for (let entry of queueEntries) {
          const qNumUpper = entry.qNum.toUpperCase().trim();
          if (!qNumUpper) continue;

          if (qNumUpper.charAt(0) !== entry.blindObj.prefix) {
            hasError = true; errorMsg = `Queue number ${qNumUpper} is invalid for ${entry.blindObj.blind}. It must start with '${entry.blindObj.prefix}'.`; break;
          }
          
          const existingActiveQueue = queues.find(q => q.id === qNumUpper);
          if (existingActiveQueue) {
            if (existingActiveQueue.phone === phone) { activeIds.add(qNumUpper); continue; } 
            else { hasError = true; errorMsg = `Authentication failed. Phone number mismatch for queue ${qNumUpper}.`; break; }
          }

          const existingHistoryQueue = history.find(q => q.id === qNumUpper);
          if (existingHistoryQueue) {
            hasError = true; errorMsg = `Queue ${qNumUpper} was over or service completed.`; break;
          }

          newQueuesToAdd.push({ id: qNumUpper, phone: phone, nickName: entry.nickName || '', memberName: entry.memberName || '', memberId: entry.memberId || '', blindObj: entry.blindObj, status: requireConfirm ? 'Pending' : 'Confirmed', confirmedAt: requireConfirm ? null : Date.now(), adminId: requireConfirm ? null : 'System (Auto)', guestReply: '', adminReply: '', createdAt: Date.now() });
          activeIds.add(qNumUpper);
        }

        if (hasError) return setDialog({ type: 'alert', title: 'Action Failed', message: errorMsg, onConfirm: () => setDialog(null) });

        const idsArray = Array.from(activeIds);
        setGuestQueueIds(idsArray);
        setGuestPhone(phone);

        if (newQueuesToAdd.length > 0) {
          updateCloudState({ queues: [...queues, ...newQueuesToAdd] });
          setJustRegisteredDate(Date.now());
          setView('guest-receipt');
        } else setView('guest-dash');
      };

      const handleGuestLogin = (queueEntries, phone) => {
         const activePenalty = penalties.find(p => {
            if (p.unbanTime <= Date.now()) return false;
            if (p.phone && p.phone === phone) return true;
            return queueEntries.some(e => {
                const matchQ = p.qId && e.qNum.toUpperCase().trim() === p.qId;
                const matchN = p.nickName && e.nickName.toUpperCase().trim() === p.nickName.toUpperCase().trim();
                return matchQ || matchN;
            });
         });

         if (activePenalty) {
             const timeLeft = Math.ceil((activePenalty.unbanTime - Date.now()) / (60 * 1000));
             setDialog({
                 type: 'prompt', inputType: 'password', title: 'Queue Restricted',
                 message: `Guest '${activePenalty.nickName || activePenalty.qId}' is restricted from queuing for another ${timeLeft} minutes.\n\nSupervisor Override Password:`,
                 input: '', confirmText: 'Override & Queue', confirmStyle: 'danger',
                 onConfirm: () => {
                     const val = document.getElementById('dialog-input').value;
                     if (val === ADMIN_PASSWORD) {
                         const updated = penalties.filter(p => p !== activePenalty);
                         updateCloudState({ penalties: updated });
                         setDialog(null);
                         setTimeout(() => executeLogin(queueEntries, phone), 100);
                     } else setDialog({ type: 'alert', title: 'Error', message: 'Invalid Supervisor Password.', onConfirm: () => setDialog(null) });
                 },
                 onCancel: () => setDialog(null)
             });
             return;
         }
         executeLogin(queueEntries, phone);
      };

      const handleAdminFastRegister = (queueEntries, phone) => {
        let hasError = false;
        let errorMsg = '';
        let newQueuesToAdd = [];
        let activeIds = new Set(); 

        for (let entry of queueEntries) {
          const qNumUpper = entry.qNum.toUpperCase().trim();
          if (!qNumUpper) continue;
          if (qNumUpper.charAt(0) !== entry.blindObj.prefix) { hasError = true; errorMsg = `Queue number ${qNumUpper} is invalid for ${entry.blindObj.blind}. It must start with '${entry.blindObj.prefix}'.`; break; }
          if (queues.find(q => q.id === qNumUpper)) { hasError = true; errorMsg = `Queue ${qNumUpper} is already active on the board.`; break; }
          if (history.find(q => q.id === qNumUpper)) { hasError = true; errorMsg = `Queue ${qNumUpper} was already completed or canceled today.`; break; }

          newQueuesToAdd.push({ id: qNumUpper, phone: phone, nickName: entry.nickName || '', memberName: 'Admin Fast Reg', memberId: 'Admin By-pass', blindObj: entry.blindObj, status: 'Confirmed', confirmedAt: Date.now(), adminId: adminName, guestReply: '', adminReply: '', createdAt: Date.now() });
          activeIds.add(qNumUpper);
        }

        if (hasError) return setDialog({ type: 'alert', title: 'Action Failed', message: errorMsg, onConfirm: () => setDialog(null) });
        if (newQueuesToAdd.length === 0) return;

        const activePenalty = penalties.find(p => {
            if (p.unbanTime <= Date.now()) return false;
            if (p.phone && p.phone === phone) return true;
            return queueEntries.some(e => {
                const matchQ = p.qId && e.qNum.toUpperCase().trim() === p.qId;
                const matchN = p.nickName && e.nickName.toUpperCase().trim() === p.nickName.toUpperCase().trim();
                return matchQ || matchN;
            });
        });

        const doRegister = () => {
            updateCloudState({ queues: [...queues, ...newQueuesToAdd] });
            setAdminRegisterOpen(false);
            setDialog({ type: 'alert', title: 'Success', message: `Successfully registered ${newQueuesToAdd.length} queue(s).`, onConfirm: () => setDialog(null) });
        };

        if (activePenalty) {
             setDialog({
                 type: 'prompt', inputType: 'password', title: 'Queue Restricted',
                 message: `Guest '${activePenalty.nickName || activePenalty.qId}' is restricted from queuing for another ${Math.ceil((activePenalty.unbanTime - Date.now()) / 60000)} minutes.\n\nSupervisor Override Password:`,
                 input: '', confirmText: 'Override & Queue', confirmStyle: 'danger',
                 onConfirm: () => {
                     const val = document.getElementById('dialog-input').value;
                     if (val === ADMIN_PASSWORD) {
                         const updated = penalties.filter(p => p !== activePenalty);
                         updateCloudState({ penalties: updated });
                         setDialog(null);
                         setTimeout(doRegister, 100);
                     } else setDialog({ type: 'alert', title: 'Error', message: 'Invalid Supervisor Password.', onConfirm: () => setDialog(null) });
                 },
                 onCancel: () => setDialog(null)
             });
             return;
        }
        doRegister();
      };

      const executeRestore = () => {
        const toRestore = history.filter(h => selectedRestores.includes(h.id));
        const newHistory = history.filter(h => !selectedRestores.includes(h.id));
        const resetRestore = toRestore.map(q => ({ ...q, status: 'Pending', endedAt: null, adminId: null, seatedAt: null }));
        updateCloudState({ queues: [...queues, ...resetRestore], history: newHistory });
        setRestoreModalOpen(false);
        setSelectedRestores([]);
      };

      const handleAdvancedReset = (options) => {
        const { clearQueues, clearSeats, clearHistory } = options;
        let newHistory = [...history];
        let newQueues = [...queues];
        let newTables = [...tables];
        const nowMs = Date.now();

        if (clearQueues) {
          if (!clearHistory) {
            const canceledQueues = newQueues.map(q => ({ ...q, status: 'Canceled', endedAt: nowMs, duration: ((nowMs - q.createdAt)/60000).toFixed(2) + ' mins', adminId: adminName }));
            newHistory = [...newHistory, ...canceledQueues];
          }
          newQueues = [];
        }

        if (clearSeats) {
          newTables = newTables.map(t => {
            if (!clearHistory) {
               t.seats.forEach(s => {
                 if (s) {
                   const durationMins = ((nowMs - s.createdAt) / 60000).toFixed(2);
                   newHistory.push({ ...s, status: 'Completed (Table)', endedAt: nowMs, duration: `${durationMins} mins`, adminId: adminName });
                 }
               });
            }
            return { ...t, seats: Array(10).fill(null) };
          });
        }

        let updates = { queues: newQueues, tables: newTables, history: newHistory };

        if (clearHistory) {
          updates.history = [];
          updates.pmlHistory = [];
          updates.pmlData = Array.from({length: 30}, () => ({ table: '', seat: '', blind: '', player: '', reqTime: '', status: '', movedTime: '', remark: '' }));
          updates.penalties = [];
        }

        updateCloudState(updates);
        setResetModalOpen(false);
        setDialog({ type: 'alert', title: 'Reset Successful', message: 'The selected data has been successfully reset across all devices.', onConfirm: () => setDialog(null) });
      };

      const toggleTableOpen = (tId) => {
        const t = tables.find(x => x.id === tId);
        if (t.isOpen && t.seats.some(s => s !== null)) return setDialog({ type: 'alert', title: 'Table Occupied', message: 'You must clear all seated players before closing this table.', onConfirm: () => setDialog(null) });
        const newTables = tables.map(x => x.id === tId ? { ...x, isOpen: !x.isOpen } : x);
        updateCloudState({ tables: newTables });
      };

      const handleDragStartQueue = (e, qId) => { e.dataTransfer.setData('source', 'queue'); e.dataTransfer.setData('qId', qId); };
      const handleDragStartSeat = (e, tId, sIdx) => { e.dataTransfer.setData('source', 'seat'); e.dataTransfer.setData('tId', tId); e.dataTransfer.setData('sIdx', sIdx.toString()); };

      const handleDropToBlindList = (e, targetBlindPrefix) => {
        e.preventDefault(); e.stopPropagation();
        const source = e.dataTransfer.getData('source');

        if (source === 'seat') {
          const tId = e.dataTransfer.getData('tId');
          const sIdx = parseInt(e.dataTransfer.getData('sIdx'), 10);
          const newTables = [...tables];
          const sourceTableIdx = newTables.findIndex(t => t.id === tId);
          const player = newTables[sourceTableIdx].seats[sIdx];
          
          if(!player) return;
          if (player.id.charAt(0).toUpperCase() !== targetBlindPrefix) return setDialog({ type: 'alert', title: 'Action Denied', message: `Queue ${player.id} can only be placed in the ${player.blindObj.blind} list.`, onConfirm: () => setDialog(null) });

          newTables[sourceTableIdx].seats[sIdx] = null;
          const newBlind = BLINDS.find(b => b.prefix === targetBlindPrefix);
          const newPlayer = { ...player, status: 'Confirmed', blindObj: newBlind, seatedAt: null };
          
          updateCloudState({ tables: newTables, queues: [...queues, newPlayer] });
        } else if (source === 'queue') {
          const draggedQId = e.dataTransfer.getData('qId');
          const qToMove = queues.find(q => q.id === draggedQId);
          if(!qToMove) return;
          if (qToMove.id.charAt(0).toUpperCase() !== targetBlindPrefix) return setDialog({ type: 'alert', title: 'Action Denied', message: `Queue ${qToMove.id} can only be placed in the ${qToMove.blindObj.blind} list.`, onConfirm: () => setDialog(null) });

          const newBlind = BLINDS.find(b => b.prefix === targetBlindPrefix);
          const updatedQ = { ...qToMove, blindObj: newBlind };
          const newQueues = queues.filter(q => q.id !== draggedQId);
          newQueues.push(updatedQ); 
          updateCloudState({ queues: newQueues });
        }
      };

      const handleDropToQueueItem = (e, targetQId, targetBlindPrefix) => {
        e.preventDefault(); e.stopPropagation();
        const source = e.dataTransfer.getData('source');

        if (source === 'seat') {
          const tId = e.dataTransfer.getData('tId');
          const sIdx = parseInt(e.dataTransfer.getData('sIdx'), 10);
          const newTables = [...tables];
          const sourceTableIdx = newTables.findIndex(t => t.id === tId);
          const player = newTables[sourceTableIdx].seats[sIdx];
          
          if(!player) return;
          if (player.id.charAt(0).toUpperCase() !== targetBlindPrefix) return setDialog({ type: 'alert', title: 'Action Denied', message: `Queue ${player.id} can only be placed in the ${player.blindObj.blind} list.`, onConfirm: () => setDialog(null) });

          newTables[sourceTableIdx].seats[sIdx] = null;
          const newBlind = BLINDS.find(b => b.prefix === targetBlindPrefix);
          const newPlayer = { ...player, status: 'Confirmed', blindObj: newBlind, seatedAt: null };
          
          const newQueues = [...queues];
          const targetIdx = newQueues.findIndex(q => q.id === targetQId);
          newQueues.splice(targetIdx, 0, newPlayer);
          updateCloudState({ tables: newTables, queues: newQueues });
        } else if (source === 'queue') {
          const draggedQId = e.dataTransfer.getData('qId');
          if (draggedQId === targetQId) return;

          const qToMove = queues.find(q => q.id === draggedQId);
          if(!qToMove) return;
          if (qToMove.id.charAt(0).toUpperCase() !== targetBlindPrefix) return setDialog({ type: 'alert', title: 'Action Denied', message: `Queue ${qToMove.id} can only be placed in the ${qToMove.blindObj.blind} list.`, onConfirm: () => setDialog(null) });

          const newBlind = BLINDS.find(b => b.prefix === targetBlindPrefix);
          const updatedQ = { ...qToMove, blindObj: newBlind };
          const filteredQueues = queues.filter(q => q.id !== draggedQId);
          const targetIdx = filteredQueues.findIndex(q => q.id === targetQId);
          if(targetIdx !== -1) filteredQueues.splice(targetIdx, 0, updatedQ);
          else filteredQueues.push(updatedQ);
          updateCloudState({ queues: filteredQueues });
        }
      };

      const handleDropToSeat = (e, targetTableId, targetSeatIdx) => {
        e.preventDefault();
        const source = e.dataTransfer.getData('source');

        if (source === 'queue') {
          const qId = e.dataTransfer.getData('qId');
          if (!qId) return;
          const q = queues.find(x => x.id === qId);
          if (!q) return;

          const newTables = [...tables];
          const tIdx = newTables.findIndex(t => t.id === targetTableId);
          const targetTable = newTables[tIdx];
          
          if (targetTable.seats[targetSeatIdx] !== null) return setDialog({ type: 'alert', title: 'Seat Occupied', message: 'Please drop the player onto an empty seat.', onConfirm: () => setDialog(null) });
          if (!targetTable.blindPrefix) return setDialog({ type: 'alert', title: 'Action Denied', message: 'Please assign a blind to the table before seating players.', onConfirm: () => setDialog(null) });
          if (q.id.charAt(0).toUpperCase() !== targetTable.blindPrefix) return setDialog({ type: 'alert', title: 'Blind Mismatch', message: `Cannot seat ticket ${q.id} at a table set to blind ${targetTable.blindPrefix}.`, onConfirm: () => setDialog(null) });

          q.seatedAt = Date.now(); 
          newTables[tIdx].seats[targetSeatIdx] = q;
          
          const newQueues = queues.filter(x => x.id !== qId);

          const playerStr = `${q.id} (${q.nickName})`;
          let changedPml = false;
          const newPmlData = pmlData.map(row => {
              if (row.player === playerStr && row.status !== 'Completed' && row.status !== 'Cancel') {
                  changedPml = true;
                  return { ...row, status: 'Completed', movedTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) };
              }
              return row;
          });

          updateCloudState({ tables: newTables, queues: newQueues, pmlData: changedPml ? newPmlData : undefined });

        } else if (source === 'seat') {
          const sourceTId = e.dataTransfer.getData('tId');
          const sourceSIdx = parseInt(e.dataTransfer.getData('sIdx'), 10);
          if (sourceTId === targetTableId && sourceSIdx === targetSeatIdx) return; 
          
          const newTables = [...tables];
          const sourceTableIdx = newTables.findIndex(t => t.id === sourceTId);
          const targetTableIdx = newTables.findIndex(t => t.id === targetTableId);
          const playerToMove = newTables[sourceTableIdx].seats[sourceSIdx];
          const playerAtTarget = newTables[targetTableIdx].seats[targetSeatIdx];
          const targetTable = newTables[targetTableIdx];

          if (targetTable.id !== sourceTId) {
             if (!targetTable.blindPrefix) return setDialog({ type: 'alert', title: 'Action Denied', message: 'Please assign a blind to the target table first.', onConfirm: () => setDialog(null) });
             if (playerToMove.id.charAt(0).toUpperCase() !== targetTable.blindPrefix) return setDialog({ type: 'alert', title: 'Blind Mismatch', message: `Cannot move ticket ${playerToMove.id} to a table set to blind ${targetTable.blindPrefix}.`, onConfirm: () => setDialog(null) });
          }

          newTables[sourceTableIdx].seats[sourceSIdx] = playerAtTarget;
          newTables[targetTableIdx].seats[targetSeatIdx] = playerToMove;
          
          const playerStr = `${playerToMove.id} (${playerToMove.nickName})`;
          let changedPml = false;
          const newPmlData = pmlData.map(row => {
              if (row.player === playerStr && row.status !== 'Completed' && row.status !== 'Cancel') {
                  changedPml = true;
                  return { ...row, status: 'Completed', movedTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) };
              }
              return row;
          });

          updateCloudState({ tables: newTables, pmlData: changedPml ? newPmlData : undefined });
        }
      };

      const removePlayerFromSeat = (tableIndex, seatIndex, player) => {
        setDialog({
          type: 'confirm', title: 'Confirm Remove?', message: `Remove ${player.nickName || player.id} from ${tables[tableIndex].id} ${seatIndex < 9 ? 'Seat ' + (seatIndex + 1) : 'Spare'}?`, confirmStyle: 'danger',
          onConfirm: () => {
             const newTables = [...tables];
             newTables[tableIndex].seats[seatIndex] = null;
             const endedAt = Date.now();
             const durationMins = ((endedAt - player.createdAt) / 60000).toFixed(2);
             const historyRecord = { ...player, status: 'Completed (Table)', endedAt, duration: `${durationMins} mins`, adminId: adminName };
             updateCloudState({ tables: newTables, history: [...history, historyRecord] });
             setDialog(null);
          }, onCancel: () => setDialog(null)
        });
      };

      const executeFinishQueue = (q, endStatus) => {
        const endedAt = Date.now();
        const durationMins = ((endedAt - q.createdAt) / 60000).toFixed(2);
        const historyRecord = { ...q, status: endStatus, endedAt, duration: `${durationMins} mins`, adminId: adminName };
        updateCloudState({ history: [...history, historyRecord], queues: queues.filter(item => item.id !== q.id) });
        setDialog(null); 
      };

      const confirmQueuePrompt = (q) => {
        setDialog({
          type: 'confirm', title: 'Confirm Queue', message: `Please verify physical queue number matches ${q.id} and confirm.`, confirmText: 'Verify & Confirm',
          onConfirm: () => { updateQueueStatus(q.id, 'Confirmed'); setDialog(null); }, onCancel: () => setDialog(null)
        });
      };

      const finishQueue = (id, endStatus) => {
        const q = queues.find(item => item.id === id);
        if (!q) return;

        if (endStatus === 'Canceled' || endStatus === 'Canceled (No Show)') {
          setDialog({
            type: 'confirm', title: 'Confirm Remove', message: `Are you sure you want to remove ${id} from the queue?`, confirmText: 'Proceed', confirmStyle: 'danger',
            onConfirm: () => {
               setDialog({
                  type: 'confirm', title: 'DOUBLE CONFIRMATION', message: `This will completely remove ${id} (${q.nickName}) and shift other queues up. Proceed?`, confirmText: 'YES, REMOVE PERMANENTLY', confirmStyle: 'danger',
                  onConfirm: () => executeFinishQueue(q, endStatus), onCancel: () => setDialog(null)
               });
            }, onCancel: () => setDialog(null)
          });
        } else executeFinishQueue(q, endStatus);
      };

      const updateQueueStatus = (id, newStatus) => {
        const updated = queues.map(q => {
          if (q.id === id) {
            const changes = { status: newStatus };
            if (newStatus === 'Calling') changes.callingStartedAt = Date.now();
            if (newStatus === 'Confirmed' && !q.confirmedAt) { changes.confirmedAt = Date.now(); changes.adminId = adminName; }
            return { ...q, ...changes };
          }
          return q;
        });
        updateCloudState({ queues: updated });
      };
      
      const acknowledgeGuestReply = (id) => {
        setDialog({
          type: 'prompt', title: 'Reply to Guest', message: 'Enter your message to acknowledge the guest:', input: '', confirmText: 'Send Reply',
          onConfirm: () => {
             const val = document.getElementById('dialog-input').value || 'Acknowledged.';
             const updated = queues.map(q => q.id === id ? { ...q, adminReply: val } : q);
             updateCloudState({ queues: updated });
             setDialog(null);
          }, onCancel: () => setDialog(null)
        });
      };

      const handlePmlBulkDelete = (indices, rows) => {
        setDialog({
          type: 'confirm', title: 'Clear All Finished', message: `Are you sure you want to clear ${rows.length} completed/canceled rows and save to history?`, confirmStyle: 'danger',
          onConfirm: () => {
            const newHist = [...pmlHistory];
            const nowMs = Date.now();
            rows.forEach((row, i) => { newHist.push({ ...row, originalIndex: indices[i], deletedAt: nowMs, adminId: adminName }); });
            
            const newData = [...pmlData];
            indices.forEach(idx => { newData[idx] = { table: '', seat: '', blind: '', player: '', reqTime: '', status: '', movedTime: '', remark: '' }; });
            
            updateCloudState({ pmlHistory: newHist, pmlData: newData });
            setDialog(null);
          }, onCancel: () => setDialog(null)
        });
      };

      // --- Rendering Logic ---
      return (
        <div className="min-h-screen bg-black text-gray-100 font-sans flex flex-col h-screen overflow-hidden">
          
          {view !== 'admin-dash' ? (
            <header className="pt-3 pb-2 border-b border-gray-800 relative z-10 bg-black flex-shrink-0">
              <div className="text-center px-4 max-w-6xl mx-auto pr-16 sm:pr-0">
                <h1 className="text-xl sm:text-2xl md:text-3xl font-black text-[#D8B673] uppercase tracking-widest mb-2 drop-shadow-md">Resort Poker Hub</h1>
                <p className="text-[8px] sm:text-[10px] md:text-xs text-white mb-1 font-bold">Welcome to Resorts World Sentosa. Kindly present your Membership Card to register at our Poker Registration Counter.</p>
                <p className="text-[8px] sm:text-[10px] md:text-xs text-white font-bold">Resorts World Sentosa supports Responsible Gaming. Call NCPG Helpline at 1800-6-668-668 for assistance, or visit http://www.ncpg.org.sg for more information. To put a limit on how much you want to gamble, you may enquire with our staff for details.</p>
              </div>
              {view === 'guest-setup' ? <div onClick={() => setView('admin-login')} className="absolute top-0 right-0 w-16 h-16 sm:w-24 sm:h-24 z-50 cursor-default" aria-label="Hidden Admin Access"></div> : null}
            </header>
          ) : null}

          <main className={`flex-grow w-full ${view === 'admin-dash' ? 'h-full overflow-hidden flex flex-col' : 'p-3 sm:p-6 overflow-y-auto relative'}`}>
            
            {view === 'guest-setup' ? <GuestSetupForm onSubmit={handleGuestLogin} visibleBlinds={visibleBlindsList} dialogFn={setDialog} requireMemberInfo={requireMemberInfo} /> : null}
            {view === 'guest-receipt' ? <ReceiptScreen queueIds={guestQueueIds} phone={guestPhone} date={justRegisteredDate} onContinue={() => setView('guest-dash')} /> : null}
            {view === 'admin-login' ? <AdminLogin onLogin={() => setView('admin-dash')} onCancel={() => setView('guest-setup')} /> : null}
            
            {view === 'guest-dash' ? (
              <div className="max-w-[1400px] mx-auto space-y-4 sm:space-y-6">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="text-lg sm:text-xl font-bold text-[#D8B673]">My Dashboard</h2>
                  <button onClick={() => setView('guest-setup')} className="text-sm text-gray-400 underline hover:text-white">Logout</button>
                </div>
                <div className="grid gap-4 sm:gap-6">
                  {guestQueueIds.map(id => {
                    const q = queues.find(item => item.id === id);
                    return <GuestStatusPanel key={id} queueId={id} queue={q} setDialog={setDialog} onReply={(reply) => { updateCloudState({ queues: queues.map(x => x.id === id ? { ...x, guestReply: reply } : x) }); }} />
                  })}
                </div>
                <div className="mt-4 sm:mt-8">
                  <h3 className="text-lg sm:text-xl font-bold mb-3 sm:mb-4 text-[#D8B673]">Live Board</h3>
                  <QueueBoard queues={queues} visibleBlinds={visibleBlindsList} />
                </div>
              </div>
            ) : null}

            {view === 'admin-dash' ? (
              <>
                <div className="bg-[#1e293b] border-b border-[#334155] p-2 flex justify-between items-center z-30 relative">
                  <div className="flex gap-2 items-center z-10">
                    <button onClick={() => setAdminLayoutMode('both')} className={`px-4 py-1.5 text-xs sm:text-sm font-bold rounded shadow transition ${adminLayoutMode === 'both' ? 'bg-[#d8b46e] text-black' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}>Split View</button>
                    <button onClick={() => setAdminLayoutMode('tables')} className={`px-4 py-1.5 text-xs sm:text-sm font-bold rounded shadow transition hidden sm:block ${adminLayoutMode === 'tables' ? 'bg-[#d8b46e] text-black' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}>Tables Only</button>
                    <button onClick={() => setAdminLayoutMode('queues')} className={`px-4 py-1.5 text-xs sm:text-sm font-bold rounded shadow transition hidden sm:block ${adminLayoutMode === 'queues' ? 'bg-[#d8b46e] text-black' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}>Queues Only</button>
                  </div>
                  
                  <div className="hidden md:flex absolute inset-0 items-center justify-center pointer-events-none gap-3">
                    <h1 className="text-[#D8B673] font-black tracking-widest uppercase text-base sm:text-lg drop-shadow-md">Resort Poker Hub</h1>
                    <div className="h-4 w-px bg-[#475569]"></div>
                    <div className="text-[10px] sm:text-xs text-gray-400 font-bold uppercase tracking-wider flex items-center gap-1.5">
                       {isSyncing ? <Icons.Cloud /> : null}
                       <span>{now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</span>
                       <span>|</span>
                       <span className="text-left w-10">{now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false })}</span>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 z-10">
                    <button onClick={() => setShowLiveBoard(!showLiveBoard)} className={`px-3 py-1.5 text-xs sm:text-sm font-bold rounded shadow transition ${showLiveBoard ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300'}`}>{showLiveBoard ? 'Hide Live Board' : 'Show Live Board'}</button>
                    <button onClick={() => setView('admin-pml')} className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs sm:text-sm px-3 py-1.5 rounded transition shadow">Movement List</button>
                    <button onClick={handleAdminExit} className="text-gray-400 text-xs sm:text-sm underline hover:text-white px-2">Exit</button>
                  </div>
                </div>

                <div className="flex flex-col lg:flex-row flex-1 w-full bg-pattern overflow-hidden">
                  
                  {(adminLayoutMode === 'both' || adminLayoutMode === 'tables') ? (
                    <div className={`overflow-y-auto p-2 sm:p-4 custom-scrollbar ${adminLayoutMode === 'both' ? 'w-full lg:w-3/4' : 'flex-1'}`}>
                      <div className={`grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-20`}>
                        {tables.filter(t => t.isOpen).map((table, tIdx) => {
                          const realIdx = tables.findIndex(x => x.id === table.id);

                          return (
                            <div key={table.id} className="bg-[#1e293b] border border-[#334155] rounded-md shadow-xl overflow-hidden flex flex-col">
                              <div className="bg-[#0f172a] p-1.5 border-b border-[#334155] flex justify-between items-center gap-1">
                                <h3 className="text-white font-bold text-[10px] sm:text-xs whitespace-nowrap">{table.id}</h3>
                                <select 
                                  className="w-auto min-w-[100px] max-w-[140px] bg-[#334155] text-[#D8B673] text-[10px] sm:text-[11px] font-bold p-1 rounded outline-none border border-[#475569] truncate ml-2"
                                  value={table.blindPrefix}
                                  onChange={(e) => {
                                    const newPrefix = e.target.value;
                                    if (newPrefix && tables[realIdx].seats.some(s => s !== null)) return setDialog({ type: 'alert', title: 'Action Denied', message: 'Cannot change table blind while players are seated.', onConfirm: () => setDialog(null) });
                                    const newT = [...tables]; newT[realIdx].blindPrefix = newPrefix; updateCloudState({ tables: newT });
                                  }}
                                >
                                  <option value="">-- Assign Blind --</option>
                                  {visibleBlindsList.map(b => <option key={b.prefix} value={b.prefix}>{b.blind} ({b.buyIn})</option>)}
                                </select>
                              </div>

                              <div className="p-1.5 flex-1 flex flex-col gap-0.5">
                                {table.seats.map((seatQueue, sIdx) => {
                                  const isSpare = sIdx === 9;
                                  const label = isSpare ? 'Spare' : `Seat ${sIdx + 1}`;
                                  const isHighlighted = seatQueue && highlightedPhone && highlightedPhone === seatQueue.phone;
                                  
                                  return (
                                    <div key={sIdx} className={`text-[10px] sm:text-xs border rounded transition-colors draggable-item ${isHighlighted ? 'bg-yellow-900/50 border-yellow-500' : seatQueue ? 'bg-[#3b82f6]/20 border-[#3b82f6]/50' : 'bg-[#0f172a] border-[#334155] hover:bg-[#1e293b]'}`}>
                                      {seatQueue ? (
                                        <div className="flex flex-col">
                                           <div 
                                             className={`flex items-center justify-between px-1.5 sm:px-2 py-1.5 cursor-pointer cursor-grab h-8 ${isHighlighted ? 'hover:bg-yellow-800/40' : ''}`}
                                             draggable={true} onDragStart={(e) => handleDragStartSeat(e, table.id, sIdx)}
                                             onClick={() => {
                                                const isExpanding = !(expandedSeat?.tId === table.id && expandedSeat?.sIdx === sIdx);
                                                setExpandedSeat(isExpanding ? {tId: table.id, sIdx} : null);
                                                setHighlightedPhone(isExpanding ? seatQueue.phone : null);
                                             }}
                                           >
                                             <span className={`font-bold truncate px-0.5 text-[10px] sm:text-xs flex items-center gap-1 w-full ${isHighlighted ? 'text-yellow-300' : 'text-white'}`}>
                                               {expandedSeat?.tId === table.id && expandedSeat?.sIdx === sIdx ? <Icons.ChevronDown className={`shrink-0 w-3 h-3 ${isHighlighted ? 'text-yellow-400' : ''}`} /> : <Icons.ChevronRight className={`shrink-0 w-3 h-3 ${isHighlighted ? 'text-yellow-400' : ''}`} />}
                                               <span className={`text-[10px] sm:text-xs font-normal w-14 sm:w-16 shrink-0 ${isHighlighted ? 'text-yellow-200' : 'text-gray-400'}`}>{label}</span>
                                               <span className="truncate">{seatQueue.id} <span className={`font-normal ${isHighlighted ? 'text-yellow-100' : 'text-gray-300'}`}>({seatQueue.nickName})</span></span>
                                             </span>
                                           </div>
                                           {expandedSeat?.tId === table.id && expandedSeat?.sIdx === sIdx ? (
                                              <div className={`p-1.5 mx-1 mb-1 rounded border text-[9px] sm:text-[10px] shadow-inner ${isHighlighted ? 'bg-yellow-900/60 border-yellow-600' : 'bg-[#1e3a8a]/40 border-[#1e40af]'}`}>
                                                 <div className={`grid grid-cols-[50px_1fr] gap-0.5 ${isHighlighted ? 'text-yellow-100' : 'text-gray-200'}`}>
                                                   <span className={isHighlighted ? 'text-yellow-200' : 'text-gray-400'}>Queue</span><span className="font-bold">{seatQueue.id}</span>
                                                   <span className={isHighlighted ? 'text-yellow-200' : 'text-gray-400'}>Name</span><span className="font-bold truncate">{seatQueue.nickName}</span>
                                                   <span className={isHighlighted ? 'text-yellow-200' : 'text-gray-400'}>Member</span><span className="font-bold truncate text-[8px] sm:text-[9px]">{seatQueue.memberName || 'N/A'} ({seatQueue.memberId || 'N/A'})</span>
                                                   <span className={isHighlighted ? 'text-yellow-200' : 'text-gray-400'}>Contact</span><span className="font-bold truncate">{seatQueue.phone}</span>
                                                 </div>
                                                 <button onClick={(e) => { e.stopPropagation(); removePlayerFromSeat(realIdx, sIdx, seatQueue); }} className="mt-1.5 w-full bg-red-600/80 hover:bg-red-500 text-white font-bold py-1 rounded transition">Remove Player</button>
                                              </div>
                                           ) : null}
                                        </div>
                                      ) : (
                                        <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDropToSeat(e, table.id, sIdx)} className="flex items-center justify-center px-1.5 py-1 h-8">
                                          <span className="text-gray-500 font-bold w-full text-center text-[10px] sm:text-xs">{label}</span>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                        {tables.filter(t => t.isOpen).length === 0 ? <div className="col-span-full p-8 text-center text-gray-500 italic text-sm">No tables are open. Use 'Manage Tables'.</div> : null}
                      </div>
                    </div>
                  ) : null}

                  {(adminLayoutMode === 'both' || adminLayoutMode === 'queues') ? (
                    <div className={`${adminLayoutMode === 'both' ? 'w-full lg:w-1/4' : 'w-full'} flex-shrink-0 bg-[#0f172a] border-l border-[#334155] flex flex-col shadow-[-10px_0_15px_-3px_rgba(0,0,0,0.5)] z-20`}>
                      <div className="flex flex-col bg-[#1e293b] border-b border-[#334155] z-30 shrink-0">
                        <div className="p-3 flex items-center gap-2 border-b border-[#334155]">
                          <button 
                             onClick={() => {
                                setDialog({
                                   type: 'prompt', title: 'Update Supervisor Info', message: 'Enter Poker Supervisor Name / EMPID:', input: adminName === 'Poker Supervisor/ EMPID' ? '' : adminName, confirmText: 'Save',
                                   onConfirm: () => { const val = document.getElementById('dialog-input').value || 'Poker Supervisor/ EMPID'; updateCloudState({ adminName: val }); setDialog(null); }, onCancel: () => setDialog(null)
                                });
                             }}
                             className="flex-1 bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-xs py-2 px-3 rounded text-center shadow shadow-black/50 outline-none transition overflow-hidden whitespace-nowrap text-ellipsis"
                          >{adminName}</button>
                          <button onClick={() => setIsAdminControlsExpanded(!isAdminControlsExpanded)} className="bg-gray-700 text-white p-2 rounded shadow hover:bg-gray-600 transition shrink-0">
                            {isAdminControlsExpanded ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                          </button>
                        </div>
                        
                        <div className={`transition-all overflow-hidden ${isAdminControlsExpanded ? 'max-h-[400px]' : 'max-h-0'}`}>
                          <div className="p-3 pt-0 flex flex-col gap-2 mt-3">
                            <div className="grid grid-cols-2 gap-2">
                              <button onClick={() => setAdminRegisterOpen(true)} className="col-span-2 bg-blue-700 hover:bg-blue-600 text-white font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition flex items-center justify-center gap-2">⚡ Admin Fast Registration</button>
                              <button onClick={() => { setSelectedRestores([]); setRestoreModalOpen(true); }} className="bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition">Restore 100 Delete</button>
                              <button onClick={() => setResetModalOpen(true)} className="bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition">Reset Queues</button>
                              <button onClick={() => setBlindModalOpen(true)} className="bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition">Blind Vis Option</button>
                              <button onClick={() => setTableModalOpen(true)} className="bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition">Manage Tables</button>
                              <button onClick={() => updateCloudState({ requireConfirm: !requireConfirm })} className="col-span-1 bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition">Require Confirmation: {requireConfirm ? 'ON' : 'OFF (Bypass)'}</button>
                              <button onClick={() => updateCloudState({ requireMemberInfo: !requireMemberInfo })} className="col-span-1 bg-[#d8b46e] hover:bg-[#c29e5a] text-black font-bold text-[10px] sm:text-xs py-2 px-2 rounded shadow transition">Member Req: {requireMemberInfo ? 'ON (Strict)' : 'OFF (Bypass)'}</button>
                            </div>
                            <div className="flex flex-col gap-2 mt-2">
                              <button onClick={() => triggerDownloads(false)} className="w-full bg-green-700 hover:bg-green-600 text-white font-bold text-xs py-2 rounded transition shadow flex items-center justify-center gap-2"><Icons.Download /> Backup / Download History</button>
                              <button onClick={() => document.getElementById('upload-backup-input').click()} className="w-full bg-indigo-700 hover:bg-indigo-600 text-white font-bold text-xs py-2 rounded transition shadow flex items-center justify-center gap-2"><Icons.Upload /> Restore / Upload Data File</button>
                              <input type="file" id="upload-backup-input" accept=".xlsx, .xls" className="hidden" onChange={handleFileUpload} />
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="flex-1 overflow-y-auto p-4 custom-scrollbar flex flex-col gap-4 pb-20">
                        {visibleBlindsList.map(b => {
                          const blindQs = queues.filter(q => q.blindObj.prefix === b.prefix);
                          const isCollapsed = collapsedBlinds[b.prefix];
                          
                          return (
                            <div key={b.prefix} className="flex flex-col min-h-[40px]" onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDropToBlindList(e, b.prefix)}>
                              <div onClick={() => setCollapsedBlinds(prev => ({ ...prev, [b.prefix]: !prev[b.prefix] }))} className={`flex justify-between items-center bg-[#2f3b75] text-white text-sm font-bold px-3 py-2.5 shadow border border-[#3e4c8a] cursor-pointer transition-all ${isCollapsed ? 'rounded' : 'rounded-t rounded-b-none border-b-0'}`}>
                                <div className="flex items-center gap-2">
                                  <Icons.ChevronDown className={`w-4 h-4 transition-transform duration-300 ${isCollapsed ? '-rotate-90' : 'rotate-0'}`} />
                                  <span>{b.blind} <span className="font-normal opacity-80 ml-1 text-xs hidden sm:inline-block">({b.buyIn})</span></span>
                                </div>
                                <div className="bg-[#1e293b] text-blue-200 px-2 py-0.5 rounded-full text-[10px] shadow-inner border border-[#334155]">Total: {blindQs.length}</div>
                              </div>
                              
                              <div className={`bg-[#1e293b] border border-[#334155] rounded-b overflow-y-auto custom-scrollbar transition-all duration-300 ${isCollapsed ? 'max-h-0 border-none opacity-0' : 'max-h-[350px] p-2 opacity-100'}`}>
                                {blindQs.length === 0 ? <div className="text-[#64748b] text-sm p-3 italic pointer-events-none font-medium">No queues</div> : (
                                  <div className="flex flex-col gap-1.5 items-stretch">
                                    {blindQs.map(q => <AdminQueueListItem key={q.id} q={q} b={b} expandedQId={expandedQId} setExpandedQId={setExpandedQId} highlightedPhone={highlightedPhone} setHighlightedPhone={setHighlightedPhone} handleDragStartQueue={handleDragStartQueue} handleDropToQueueItem={handleDropToQueueItem} finishQueue={finishQueue} updateQueueStatus={updateQueueStatus} acknowledgeGuestReply={acknowledgeGuestReply} confirmQueuePrompt={confirmQueuePrompt} isSeated={seatedPhones.has(q.phone)} />)}
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {showLiveBoard ? (
                         <div className="border-t border-[#334155] p-2 bg-[#0f172a] h-48 overflow-y-auto">
                            <h3 className="text-xs font-bold mb-2 text-[#D8B673] uppercase tracking-wider">Live Board Mini</h3>
                            <QueueBoard queues={queues} visibleBlinds={visibleBlindsList} />
                         </div>
                      ) : null}
                    </div>
                  ) : null}
                </div>
              </>
            ) : null}

            {view === 'admin-pml' ? (
              <PlayerMovementList 
                data={pmlData} 
                tables={tables}
                updateData={(newData) => updateCloudState({ pmlData: newData })} 
                onBack={() => setView('admin-dash')} 
                requestDelete={(index, row) => {
                  setDialog({
                    type: 'confirm', title: 'Clear Movement Row', message: `Clear Row ${index + 1} and save to history?`, confirmStyle: 'danger',
                    onConfirm: () => {
                      const newHist = [...pmlHistory, { ...row, originalIndex: index, deletedAt: Date.now(), adminId: adminName }];
                      const newData = [...pmlData];
                      newData[index] = { table: '', seat: '', blind: '', player: '', reqTime: '', status: '', movedTime: '', remark: '' };
                      updateCloudState({ pmlHistory: newHist, pmlData: newData });
                      setDialog(null);
                    }, onCancel: () => setDialog(null)
                  });
                }}
                bulkDelete={handlePmlBulkDelete}
                onApplyPenalty={handlePmlPenalty}
                onCheckPenalty={handleCheckPmlPenalty}
              />
            ) : null}
          </main>

          {view !== 'admin-dash' ? (
            <footer className="bg-black border-t border-gray-800 p-4 text-center mt-auto flex-shrink-0">
              <p className="text-[10px] sm:text-xs text-gray-500 max-w-4xl mx-auto">Disclaimer: Final decision and management of the queue remains strictly with RWS Management and Counter Staff.</p>
            </footer>
          ) : null}

          {showNewDayReminder && view === 'admin-dash' ? (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-[#1e293b] border border-[#D8B673] p-6 rounded-xl shadow-2xl max-w-md w-full text-center">
                <Icons.Alert className="w-12 h-12 text-yellow-400 mx-auto mb-4" />
                <h3 className="text-xl font-bold text-[#D8B673] mb-2 uppercase tracking-wider">New Trading Day Started</h3>
                <p className="text-gray-300 text-sm mb-6 leading-relaxed">Trading dates automatically reset at 04:00 AM.<br/><br/><span className="text-white font-bold bg-red-900/40 px-3 py-1 rounded">Supervisor Reminder:</span><br/>Please download the daily backup file and clear all data to start fresh for the new day.</p>
                <div className="flex flex-col gap-3">
                  <button onClick={() => { triggerDownloads(false); setShowNewDayReminder(false); setResetModalOpen(true); }} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition shadow-lg flex items-center justify-center gap-2"><Icons.Download /> 1. Backup & Go to Reset</button>
                  <button onClick={() => setShowNewDayReminder(false)} className="w-full border border-gray-600 hover:bg-gray-800 text-gray-400 font-bold py-2 rounded-lg transition">Dismiss Warning</button>
                </div>
              </div>
            </div>
          ) : null}

          {resetModalOpen ? <AdminResetModal onClose={() => setResetModalOpen(false)} onReset={handleAdvancedReset} /> : null}
          {adminRegisterOpen ? <AdminFastRegisterModal visibleBlinds={visibleBlindsList} onClose={() => setAdminRegisterOpen(false)} onRegister={handleAdminFastRegister} /> : null}
          {blindModalOpen ? <AdminBlindModal blindVis={blindVis} updateBlindVis={(v) => updateCloudState({ blindVis: v })} autoBlindEnabled={autoBlindEnabled} updateAutoBlindEnabled={(v) => updateCloudState({ autoBlindEnabled: v })} weeklyPresets={weeklyPresets} updateWeeklyPresets={(v) => updateCloudState({ weeklyPresets: v })} onClose={() => setBlindModalOpen(false)} now={now} /> : null}

          {restoreModalOpen ? (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-[#1e293b] border border-[#475569] p-6 rounded-xl shadow-2xl max-w-md w-full flex flex-col h-full max-h-[80vh]">
                <div className="flex justify-between items-center mb-4 border-b border-gray-600 pb-2">
                   <h3 className="text-lg font-bold text-white">Restore Last 100 Delete</h3>
                   <button onClick={() => setRestoreModalOpen(false)} className="text-gray-400 hover:text-white"><Icons.Close /></button>
                </div>
                <div className="space-y-1 mb-4 flex-1 overflow-y-auto custom-scrollbar">
                   {history.filter(h => !h.player).slice(-100).reverse().map(h => (
                      <label key={h.id + h.endedAt} className="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded border border-transparent hover:border-[#334155] transition-colors">
                         <input type="checkbox" className="w-4 h-4 rounded" checked={selectedRestores.includes(h.id)} onChange={(e) => { if (e.target.checked) setSelectedRestores([...selectedRestores, h.id]); else setSelectedRestores(selectedRestores.filter(id => id !== h.id)); }} />
                         <span className="text-gray-200 font-medium text-sm">{h.id} ({h.nickName || 'N/A'})</span>
                         <span className="text-gray-500 text-xs ml-auto whitespace-nowrap">{new Date(h.endedAt).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
                      </label>
                   ))}
                   {history.length === 0 ? <p className="text-gray-500 italic text-center p-4">No recently deleted queues.</p> : null}
                </div>
                <div className="flex gap-2 shrink-0">
                   <button onClick={() => setRestoreModalOpen(false)} className="flex-1 bg-gray-600 text-white font-bold py-2.5 rounded transition">Cancel</button>
                   <button onClick={executeRestore} disabled={selectedRestores.length===0} className="flex-1 bg-[#d8b46e] hover:bg-[#c29e5a] disabled:opacity-50 text-black font-bold py-2.5 rounded transition">Confirm Restore</button>
                </div>
              </div>
            </div>
          ) : null}

          {tableModalOpen ? (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-[#1e293b] border border-[#475569] p-6 rounded-xl shadow-2xl max-w-sm w-full">
                <h3 className="text-lg font-bold text-white mb-4 border-b border-gray-600 pb-2">Table Open/Close Management</h3>
                <div className="space-y-3 mb-6 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                  {tables.map(t => (
                    <div key={t.id} className="flex justify-between items-center bg-[#0f172a] p-2 rounded border border-[#334155]">
                      <span className={`text-sm font-bold ${t.isOpen ? 'text-white' : 'text-gray-500'}`}>{t.id}</span>
                      <button onClick={() => toggleTableOpen(t.id)} className={`text-xs font-bold px-4 py-1.5 rounded transition-colors ${t.isOpen ? 'bg-green-600 text-white' : 'bg-gray-700 text-gray-400 border border-gray-600'}`}>{t.isOpen ? 'OPEN' : 'CLOSED'}</button>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2"><button onClick={() => setTableModalOpen(false)} className="w-full bg-[#d8b46e] text-black font-bold py-2.5 rounded transition">Done</button></div>
              </div>
            </div>
          ) : null}

          {dialog ? (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-[#1e293b] border border-[#D8B673] p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
                <h3 className="text-lg sm:text-xl font-bold text-[#D8B673] mb-4">{dialog.title}</h3>
                <p className="text-white mb-4 text-sm sm:text-base leading-relaxed whitespace-pre-wrap">{dialog.message}</p>
                {dialog.input !== undefined ? <input type={dialog.inputType || "text"} id="dialog-input" defaultValue={dialog.input} placeholder={dialog.inputPlaceholder || ""} className={`w-full bg-black border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-[#D8B673] ${dialog.input2 !== undefined ? 'mb-3' : 'mb-6'}`} /> : null}
                {dialog.input2 !== undefined ? <input type={dialog.inputType2 || "password"} id="dialog-input-2" defaultValue={dialog.input2} placeholder={dialog.inputPlaceholder2 || ""} className="w-full bg-black border border-gray-600 rounded p-2 text-white mb-6 focus:outline-none focus:border-[#D8B673]" /> : null}
                <div className="flex flex-col sm:flex-row gap-3 justify-center mt-4">
                  {dialog.type === 'confirm' || dialog.input !== undefined ? <button onClick={dialog.onCancel} className="flex-1 bg-gray-800 text-gray-300 py-2.5 rounded-lg hover:bg-gray-700 transition border border-gray-600 font-bold">{dialog.cancelText || 'Cancel'}</button> : null}
                  <button onClick={dialog.onConfirm} className={`flex-1 py-2.5 rounded-lg font-bold transition ${dialog.confirmStyle === 'danger' ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-[#D8B673] hover:bg-[#c29e5a] text-black'}`}>{dialog.confirmText || 'OK'}</button>
                </div>
              </div>
            </div>
          ) : null}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
